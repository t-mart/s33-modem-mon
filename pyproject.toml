[project]
name = "s33-modem-mon"
version = "0.2.0"
description = "Tools for the Arris S33 modem: a CLI and a monitoring service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
monitor = ["psycopg2-binary>=2.9.11"]

[project.scripts]
s33 = "s33mon.cli:main"
s33mon = "s33mon.cli:monitor_cmd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s33mon"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "psycopg2-binary>=2.9.11",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
